<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="diagram-title"><title id="diagram-title">Service request record-triggered Flow diagram</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.2"/></marker><marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#b91c1c" stroke-width="1.2"/></marker><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#166534" stroke-width="1.2"/></marker></defs><text x="30" y="49.5" text-anchor="start" fill="#1e293b" font-size="32" font-family="Segoe UI, Arial, sans-serif"><tspan x="30" dy="0">Service request automation</tspan></text><text x="30" y="80.875" text-anchor="start" fill="#475569" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="30" dy="0">Part C  |  Record-triggered Flow design  |  Only real field transitions cause work</tspan></text><rect x="20" y="105" width="1000" height="1020" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="44" y="151.375" text-anchor="start" fill="#1e293b" font-size="25" font-family="Segoe UI, Arial, sans-serif"><tspan x="44" dy="0">A. ServiceRequest__c — after update</tspan></text><rect x="1050" y="105" width="530" height="1020" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="1074" y="151.375" text-anchor="start" fill="#1e293b" font-size="25" font-family="Segoe UI, Arial, sans-serif"><tspan x="1074" dy="0">B. Escalation__c — after create</tspan></text><rect x="275" y="180" width="490" height="65" rx="12" fill="#a5d8ff" stroke="#334155" stroke-width="2"/><text x="520.0" y="220.375" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="520.0" dy="0">After-save: related-record actions</tspan></text><polyline points="520,245 520,285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polygon points="520.0,285 675,347.5 520.0,410 365,347.5" fill="#fff3bf" stroke="#334155" stroke-width="2"/><text x="520.0" y="342.25" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="520.0" dy="0">Relevant field</tspan><tspan x="520.0" dy="26.25">transition?</tspan></text><polyline points="675,347 790,347" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="730.0" y="332.5" text-anchor="middle" fill="#475569" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="730.0" dy="0">No</tspan></text><rect x="790" y="311" width="180" height="73" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="880.0" y="342.25" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="880.0" dy="0">End</tspan><tspan x="880.0" dy="26.25">No work</tspan></text><polyline points="520,410 520,450" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="570.0" y="435.5" text-anchor="middle" fill="#475569" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="570.0" dy="0">Yes</tspan></text><polygon points="520.0,450 680,512.5 520.0,575 360,512.5" fill="#fff3bf" stroke="#334155" stroke-width="2"/><text x="520.0" y="495.0" text-anchor="middle" fill="#1e293b" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="520.0" dy="0">Customer set +</tspan><tspan x="520.0" dy="25.0">Status changed</tspan><tspan x="520.0" dy="25.0">to one of these?</tspan></text><polyline points="360,512 250,512 250,610" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="189.0" y="544.5" text-anchor="middle" fill="#475569" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="189.0" dy="0">In Progress</tspan></text><rect x="75" y="610" width="350" height="110" rx="12" fill="#b2f2bb" stroke="#334155" stroke-width="2"/><text x="250.0" y="635.0" text-anchor="middle" fill="#1e293b" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="250.0" dy="0">Get Customer; if found</tspan><tspan x="250.0" dy="25.0">and state differs, update:</tspan><tspan x="250.0" dy="25.0">ServiceState__c =</tspan><tspan x="250.0" dy="25.0">Active Handling</tspan></text><polyline points="680,512 800,512 800,610" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="843.0" y="562.5" text-anchor="middle" fill="#475569" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="843.0" dy="0">Closed</tspan></text><rect x="625" y="610" width="350" height="110" rx="12" fill="#b2f2bb" stroke="#334155" stroke-width="2"/><text x="800.0" y="635.0" text-anchor="middle" fill="#1e293b" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="800.0" dy="0">Get Customer; if found</tspan><tspan x="800.0" dy="25.0">and state differs, update:</tspan><tspan x="800.0" dy="25.0">ServiceState__c =</tspan><tspan x="800.0" dy="25.0">Needs Review</tspan></text><polyline points="520,575 520,780" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="519.5" y="668.5" text-anchor="middle" fill="#475569" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="519.5" dy="0">Otherwise: skip</tspan></text><polyline points="250,720 250,750 480,750 480,795" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,720 800,750 560,750 560,795" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polygon points="520.0,780 680,840.0 520.0,900 360,840.0" fill="#fff3bf" stroke="#334155" stroke-width="2"/><text x="520.0" y="834.75" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="520.0" dy="0">Priority changed</tspan><tspan x="520.0" dy="26.25">to Critical?</tspan></text><polyline points="680,840 790,840" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="745.0" y="825.5" text-anchor="middle" fill="#475569" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="745.0" dy="0">No</tspan></text><rect x="790" y="806" width="180" height="68" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="880.0" y="847.875" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="880.0" dy="0">End</tspan></text><polyline points="360,840 265,840 265,920" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="310.5" y="862.5" text-anchor="middle" fill="#475569" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="310.5" dy="0">Yes</tspan></text><rect x="60" y="920" width="425" height="105" rx="12" fill="#d0bfff" stroke="#334155" stroke-width="2"/><text x="272.5" y="955.0" text-anchor="middle" fill="#1e293b" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="272.5" dy="0">Get Service_Settings__mdt.Default</tspan><tspan x="272.5" dy="25.0">ServiceManagerId__c → active User</tspan><tspan x="272.5" dy="25.0">Missing / invalid: fault</tspan></text><polyline points="485,972 590,972" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="535.0" y="955.5" text-anchor="middle" fill="#475569" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="535.0" dy="0">Valid</tspan></text><rect x="590" y="920" width="385" height="105" rx="12" fill="#d0bfff" stroke="#334155" stroke-width="2"/><text x="782.5" y="955.0" text-anchor="middle" fill="#1e293b" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="782.5" dy="0">Create Escalation__c</tspan><tspan x="782.5" dy="25.0">OwnerId = manager Id</tspan><tspan x="782.5" dy="25.0">ServiceRequest__c = request Id</tspan></text><polyline points="880,920 880,874" fill="none" stroke="#166534" stroke-width="2" marker-end="url(#green-arrow)"/><text x="757.5" y="904.5" text-anchor="middle" fill="#166534" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="757.5" dy="0">Success / commit</tspan></text><polyline points="75,665 42,665 42,1080 150,1080" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#red-arrow)"/><polyline points="975,665 1000,665 1000,1080 940,1080" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#red-arrow)"/><polyline points="265,1025 265,1045" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#red-arrow)"/><polyline points="785,1025 785,1045" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#red-arrow)"/><rect x="150" y="1045" width="790" height="65" rx="12" fill="#ffc9c9" stroke="#b91c1c" stroke-width="2"/><text x="545.0" y="1072.5" text-anchor="middle" fill="#1e293b" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="545.0" dy="0">Get / Update / Create fault → Custom Error</tspan><tspan x="545.0" dy="25.0">Roll back the request and related changes</tspan></text><rect x="1100" y="180" width="430" height="85" rx="12" fill="#a5d8ff" stroke="#334155" stroke-width="2"/><text x="1315.0" y="217.25" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="1315.0" dy="0">Escalation record created</tspan><tspan x="1315.0" dy="26.25">Run asynchronously after commit</tspan></text><polyline points="1315,265 1315,330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1100" y="330" width="430" height="100" rx="12" fill="#d0bfff" stroke="#334155" stroke-width="2"/><text x="1315.0" y="374.75" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="1315.0" dy="0">Get CustomNotificationType</tspan><tspan x="1315.0" dy="26.25">by developer name</tspan></text><polyline points="1315,430 1315,495" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polygon points="1315.0,495 1470,555.0 1315.0,615 1160,555.0" fill="#fff3bf" stroke="#334155" stroke-width="2"/><text x="1315.0" y="549.75" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="1315.0" dy="0">Notification type</tspan><tspan x="1315.0" dy="26.25">found?</tspan></text><polyline points="1315,615 1315,680" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1362.5" y="653.5" text-anchor="middle" fill="#475569" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="1362.5" dy="0">Yes</tspan></text><rect x="1100" y="680" width="430" height="120" rx="12" fill="#d0bfff" stroke="#334155" stroke-width="2"/><text x="1315.0" y="721.625" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="1315.0" dy="0">Send Custom Notification</tspan><tspan x="1315.0" dy="26.25">Recipient: Escalation.OwnerId</tspan><tspan x="1315.0" dy="26.25">Target: ServiceRequest__c</tspan></text><polyline points="1315,800 1315,850" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1210" y="850" width="210" height="70" rx="12" fill="#b2f2bb" stroke="#334155" stroke-width="2"/><text x="1315.0" y="892.875" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="1315.0" dy="0">End</tspan></text><polyline points="1160,555 1075,555 1075,1030 1100,1030" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#red-arrow)"/><text x="1110.0" y="535.5" text-anchor="middle" fill="#b91c1c" font-size="20" font-family="Segoe UI, Arial, sans-serif"><tspan x="1110.0" dy="0">No</tspan></text><polyline points="1530,380 1555,380 1555,1030 1530,1030" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#red-arrow)"/><polyline points="1530,740 1555,740" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#red-arrow)"/><rect x="1100" y="975" width="430" height="130" rx="12" fill="#ffd8a8" stroke="#9a3412" stroke-width="2"/><text x="1315.0" y="1021.625" text-anchor="middle" fill="#1e293b" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="1315.0" dy="0">Failure: admin monitoring</tspan><tspan x="1315.0" dy="26.25">and manual notification retry</tspan><tspan x="1315.0" dy="26.25">Saved request and escalation remain</tspan></text><text x="35" y="1158.75" text-anchor="start" fill="#475569" font-size="21" font-family="Segoe UI, Arial, sans-serif"><tspan x="35" dy="0">Entry = Status changes to In Progress / Closed OR Priority changes to Critical. Both branches may run in one update.</tspan><tspan x="35" dy="26.25">Red dashed arrows = fault paths. Customer changes are skipped when the lookup is empty; escalation remains independent.</tspan></text></svg>